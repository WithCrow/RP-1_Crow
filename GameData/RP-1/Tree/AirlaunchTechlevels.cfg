// Purchase cost to unlock these carriers. You can use them in sims without unlocking them, but only if they are researched or being researched. 
// You can only use them for the real deal if you've unlocked them
@ENTRYCOSTMODS:FOR[RP-0]
{ // Syntax for a tech: Airlaunch- and name, like B29, etc.
	Airlaunch-B29 = 5000
	Airlaunch-B50 = 3000, Airlaunch-B29
	Airlaunch-NB52 = 15000
	Airlaunch-NB52B = 3000, Airlaunch-NB52
	Airlaunch-C141 = 5000, Airlaunch-NB52B
	Airlaunch-B747SCA = 5000, Airlaunch-C141
	Airlaunch-AN225 = 8000, Airlaunch-B747SCA
	Airlaunch-HEAVYM2 = 10000, Airlaunch-AN225
	Airlaunch-HEAVYM3 = 10000, Airlaunch-HEAVYM2
}

PARTUPGRADE
{
	name = Airlaunch-B29
	partIcon = SXTmk3Cockpit52
	techRequired = supersonicDev
	entryCost = 5000
	cost = 0
	title = Airlaunch Carrier: B-29 Superfortress
	manufacturer = Generic
	description = Adds the B-29 as an airlaunch carrier. Payload up to 7.5 t and 12 x 6 x 13 m (width x height x length), released at up to 7500 m and 150 m/s. Choose the carrier when prepping a vessel for airlaunch. NOTE: This is not a part you can use, it just symbolizes the new capabilities you can unlock.
}

