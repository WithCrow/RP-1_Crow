CONTRACT_TYPE
{
	name = CLD_ComSatRep
	title = Customer Satellite Launch
	group = ComLaunchDev
	agent = Federation Aeronautique Internationale
	
	description = <b>Program: Commercial Launch Development<br>Type: <color=blue>Optional</color></b><br><br>Launching customer satellites is quickly becoming a routine operation for our company. More have lined up, with heavier payloads than what we have launched so far.

	synopsis = Launch a customer satellite into a sun-synchronous orbit

	completedMessage = Success! With each successful launch, our company attracts more attention, which means more investors and customers!

	sortKey = 2505

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 3
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 75
	failureReputation = 0

	// ************ DATA ************
	
	DATA
	{
		type = int
		CLDSatCount = 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression
		CONTRACT_OFFERED
		{
			CLDSatCount = $CLDSatCount + 0
		}
		CONTRACT_COMPLETED_SUCCESS
		{
			CLDSatCount = $CLDSatCount + 1
		}
	}

	DATA
	{
		type = List<float>
		CLDMissionPayloadList = [ 400, 600, 800 ]
	}

	DATA
	{
		type = float
		CLDMissionPayload = @CLDMissionPayloadList.ElementAt(@CLDSatCount)
	}
	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComLaunchDev
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = CLD_ComSat
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Sun-synchronous satellite

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			title = Survive in orbit for a day

			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 0.001
				title = Craft must have Electric Charge after one day
				hideChildren = true
			}
				
			PARAMETER
			{
				name = HasComSatPayload
				type = HasResource
				resource = ComSatPayload
				minQuantity = @/CLDMissionPayload - 0.1
				title = Have a ComSatPayload of at least @/CLDMissionPayload units on the craft
				hideChildren = true
			}

			PARAMETER
			{
				name = Orbit
				type = Orbit
				minInclination = 95
				maxInclination = 99
				maxEccentricity = 0.04
				minPeA = 300000
				disableOnStateChange = true
				title = Reach the correct orbit within the parameters. Note: This orbit is slightly retrograde.
			}

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 1d
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}
