CONTRACT_TYPE
{
	name = Reuse_SuborbitalHop
	title = Reusable Rocket Suborbital Hop
	group = ReuseDev
	agent = Federation Aeronautique Internationale

	description = <b>Program: Reusable Rocket Development<br>Type: <color=blue>Optional</color></b><br><br>After proving we can ascend to a few kilometres and land again, it is time to go even further: all the way to 140 km! <br><br>This is a series of @maxCompletions contracts, of which @index have been completed.

	synopsis = Perform a suborbital hop.

	completedMessage = Well Done! With each completed hop, we expand the flight envelope further.

	sortKey = 1000

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 3
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 200
	failureReputation = 0


	// ************ DATA *************
	DATA
	{
		type = List<float>
		TargetAltitude = [50, 100, 500, 1000, 2500, 3000] // meters
	}
	DATA
	{
		type = List<float>
		TargetDuration = [30, 30, 60, 80, 80, 80] // seconds
	}

	DATA
	{
		type = int
		index = $Hop + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression
		
		CONTRACT_COMPLETED_SUCCESS
		{
			Hop = $Hop + 1
		}
	}

	DATA
	{
		type = Altitude
		AltTarget = @TargetAltitude.ElementAt(@index)
		title = Altitude
	}
	DATA
	{
		type = Duration
		HopDur = @TargetDuration.ElementAt(@index)
		title = Duration
	}

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = SuborbRocketDev
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = KarmanLine
	}
	
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = exclude_SoundingRocket
		invertRequirement = true
	}
	
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = exclude_SoundingDownrange
		invertRequirement = true
	}
	
	PARAMETER
	{
		name = OrbitReturn
		type = VesselParameterGroup
		title = Suborbital return

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = BuiltAtVAB
			type = VesselBuiltAt
			builtAt = VAB
		}
		PARAMETER
		{
			name = HasNoCrew
			type = HasCrew
			maxCrew = 0
			minCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = ReachState
			type = ReachState
			situation = FLYING
			minRateOfClimb = 10
			title = Climb with at least 10 m/s
			hideChildren = true
		}
		PARAMETER
		{
			name = ReachSpace
			type = ReachState
			disableOnStateChange = True
			situation = SUB_ORBITAL
			title = Reach space
		}
		PARAMETER
		{
			name = NoStaging
			type = NoStaging
			title = Do not Stage
			failContract = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			duration = 90
			title = Fly for at least 90 seconds
			completeInSequence = true
			hideChildren = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely
			hideChildren = true
			completeInSequence = true
		}
	}
}