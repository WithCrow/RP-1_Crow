CONTRACT_TYPE
{
	name = OES_Expedition
	title = Station Expedition Handover
	group = OperationalEarthStations
	agent = Stations

	description = <b>Program: Operational Earth Stations<br>Type: <color=green>Required</color></b><br><br>Unlike our first space station, this will be a permanent one. It will never be left empty - each expedition crew will spend a few days sharing the station with the next one before heading home. Launch a new crew of at least three to the station and only return the previous crew once the hand-over is complete. The station must still have three crew aboard after the handover.<br><br>Each expedition adds 180 days of Multi-Year Space Habitation research, which consumes 750 units of Research Payload every 30 days, so plan your cargo deliveries. This contract does require a new set of crew.&br;&br;<b>Number of Expeditions Completed: @/index / @/maxCompletions</b>

	synopsis = Hand the station over to a new expedition crew

	completedMessage = Congratulations! The new expedition crew has settled in, and the previous crew is safely back on Earth.

	sortKey = 1610

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 4
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ************ REWARDS ************

	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 800
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = OperationalEarthStations
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OES_CoreModule
	}

	// Each expedition takes Permanent Space Habitation 180 days further, on top of the 30 days of OES_CoreModule (3650 days in total)
	DATA
	{
		type = List<float>
		experimentList = [0.05753, 0.10685, 0.15616, 0.20548]
	}
	DATA
	{
		type = float
		experimentCompletion = @/experimentList.ElementAt(@/index)
		durationText = Round(3650 * @/experimentList.ElementAt(@/index), 1)
	}
	DATA
	{
		type = int
		index = $OES_Expedition_Count + 0
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression

		CONTRACT_COMPLETED_SUCCESS
		{
			OES_Expedition_Count = $OES_Expedition_Count + 1
		}
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = ArrivingCrew
		type = VesselParameterGroup
		title = Launch the next expedition crew and dock with the station
		disableOnStateChange = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new crew vehicle
			hideChildren = true
		}
		PARAMETER
		{
			name = ThreeCrew
			type = HasCrew
			minCrew = 3
			crewOnly = true
			title = Have at least 3 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			vessel = OperationalStation
			completeInSequence = true
			title = Dock with the station
		}
	}
	PARAMETER
	{
		name = DepartingCrew
		type = VesselParameterGroup
		title = Once the new crew has arrived, bring the previous expedition crew home
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = ThreeCrew
			type = HasCrew
			minCrew = 3
			crewOnly = true
			title = Have at least 3 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = IsNotStation
			type = IsNotVessel
			vessel = OperationalStation
			hideChildren = true
		}
		PARAMETER
		{
			name = Rendezvous
			type = Rendezvous
			vessel = OperationalStation
			distance = 100
			title = Undock from the station
		}
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely
			hideChildren = true
			completeInSequence = true
		}
	}
	PARAMETER
	{
		name = StayOnStation
		type = VesselParameterGroup
		title = Keep at least 3 crew aboard the station and continue Permanent Space Habitation
		vessel = OperationalStation
		notes = You can work on other contracts while your crew are working. You are safe to return to Mission Control
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = ThreeCrew
			type = HasCrew
			minCrew = 3
			crewOnly = true
			title = Have at least 3 crewmembers on board
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = 300000
			maxApA = 500000
			targetBody = HomeWorld()
			disableOnStateChange = false
			title = Remain in a stable orbit
		}
		PARAMETER
		{
			name = PermanentSpaceHabitation
			type = RP1CollectScience
			title = Complete at least @/durationText out of 3650 days of Permanent Space Habitation
			notes = This experiment requires 3 crew and consumes 750 units of Research Payload every 30 days
			targetBody = HomeWorld()
			situation = InSpaceLow
			experiment = RP0longDurationHabit3
			fractionComplete = @/experimentCompletion
		}
	}
}
