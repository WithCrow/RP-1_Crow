CONTRACT_TYPE
{
	name = AXP_Supercruise_Range
	group = AdvXPlanes
	title = Uncrewed Long Duration Supersonic Cruise

	description = <b>Program: Advanced X-Plane Research<br>Type: <color=blue>Optional</color></b><br><br>Design, build, and fly an uncrewed supersonic jet-powered craft carrying a sounding payload, sustaining supersonic cruise for an extended duration, then return home safely.

	synopsis = Sustain supersonic cruise for an extended duration with an uncrewed jet-powered craft carrying @/missionPayload.Print() units of Sounding Payload.
	
	completedMessage = Congratulations on a successful flight!
	
	sortKey = 4501

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0
	
	targetBody = HomeWorld()
	
	// ************ REWARDS ************
	prestige = Trivial       // 1.0x
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 75
	failureReputation = 0 // was @rewardReputation

	// ************ REQUIREMENTS ************t

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = AdvXPlanes
	}
	
	DATA
	{
		title = Payload
		type = int
		missionPayload = 50
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = AXP_Supercruise	
	}
	
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = exclude_Supersonic
		invertRequirement = true
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Maintain between @HoldSituation/minSpeed m/s and @HoldSituation/maxSpeed m/s in level flight with an uncrewed jet aircraft.
		define = supersonicCraft
		dissassociateVesselsOnContractCompletion = true
		resetChildrenWhenVesselDestroyed = true
		
		PARAMETER
		{
			name = BuiltAtSPH
			type = VesselBuiltAt
			builtAt = SPH
		}

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
		{
			name = NoRocket
			type = PartValidation
			title = Vessel is a jet (no rocket engines allowed)
			hideChildren = true
			NONE
			{
				partModule = ModuleEnginesRF
				partModule = ModuleEnginesAJEPropeller
			}
		}
		
		PARAMETER
		{
			name = HasSoundingPayload
			type = HasResource
			resource = SoundingPayload
			minQuantity = @/missionPayload - 0.1
			title = Have a SoundingPayload of at least @/missionPayload.Print() units on the craft
			hideChildren = true
		}
		
		PARAMETER
		{
			name = HoldSituation
			type = ReachState
			minSpeed = 815 // ~M2.5
			maxSpeed = 1150 // ~M3.5
			minRateOfClimb = -50 // set a looser set of parameters, that way time warp can be used at higher settings and the length of the flight won't become monotonous.
			maxRateOfClimb = 50 // see above :)
			situation = FLYING
			
			title = Hold between @minSpeed m/s to @maxSpeed m/s in level flight.
			
			disableOnStateChange = true
			
		}

		PARAMETER
		{
			name = SustainedCruise
			type = SustainedCruise
			resource = Kerosene
			requiredRange = 4401000 // duration * lower speed band; range = speed * fuel / burnRate
			holdSeconds = 300 // all conditions must hold continuously for 5 min
			minSpeed = 815
			maxSpeed = 1150
			minVerticalSpeed = -50
			maxVerticalSpeed = 50
		}
	}
}