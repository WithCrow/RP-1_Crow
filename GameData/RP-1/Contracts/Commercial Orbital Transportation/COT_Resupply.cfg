CONTRACT_TYPE
{
	name = COT_Resupply
	title = Commercial Resupply Mission @CRS_Count
	group = ComOrbTrans
	agent = Federation Aeronautique Internationale
	
	description = <b>Program: Commercial Orbital Transport<br>Type: <color=red>CAPSTONE</color></b><br><br> Our demonstration was successful and we have been tasked with rendezvousing and docking.<br><br>This is a series of @maxCompletions contracts, of which @CRS_Count have been completed.</color>

	synopsis = Resupply a station in LEO

	completedMessage = Success! Our resupply mission achieved all objectives!

	sortKey = 2601

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 4
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ************ REWARDS ************
	prestige = Exceptional
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 180
	failureReputation = 0

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression
		CONTRACT_OFFERED
		{
			CRS_Count = $CRS_Count + 0
		}
		CONTRACT_COMPLETED_SUCCESS
		{
			CRS_Count = $CRS_Count + 1
		}
	}


	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = ComOrbTrans
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Commercial Resupply

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 0.001
				title = Craft must have Electric Charge after one day
				hideChildren = true
			}
			PARAMETER
			{
				name = HasResearchPayload
				type = HasResource
				resource = ResearchPayload
				minQuantity = 4999.9
				title = Have a ResearchPayload of at least 5000 units on the craft
				hideChildren = true
			}
			PARAMETER
			{
				name = DockingPort
				type = PartValidation
				partModule = ModuleDockingNode
				minCount = 1
				title = Have at least 1 docking port
				hideChildren = true
			}
			PARAMETER
			{
				name = Rendezvous
				type = Rendezvous
				vessel = prototypeSpaceStation // TODO: CHANGE!
				distance = 100
				title = Rendezvous with the station.
			}
			PARAMETER
			{
				name = Docking
				type = Docking
				vessel = prototypeSpaceStation // TODO: CHANGE!
				completeInSequence = true
				title = Dock with the station.
			}
			PARAMETER
			{
				name = ReturnHome
				type = RP1ReturnHome
				title = Return home safely
				hideChildren = true
				completeInSequence = true
			}
		}
	}
}

