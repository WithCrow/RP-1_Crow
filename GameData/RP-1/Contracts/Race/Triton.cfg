CONTRACT_TYPE
{
	name = Race_Triton_Flyby
	title = Race: Triton Flyby
	group = RaceFirsts
	agent = Federation Aeronautique Internationale

	description = <b>Race: Exploration Firsts</b><br><br>Send an uncrewed vessel on a flyby of Triton, passing within 20,000 km. This contract unlocks after the uncrewed flyby of Neptune.

	synopsis = Flyby Triton within 20,000 km (uncrewed)

	completedMessage = Triton flyby complete!

	sortKey = 270

	cancellable = false
	declinable = false
	autoAccept = true
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Triton

	// No rewards, this is purely a race tracker
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 0
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = CompleteContract_Race_Neptune_Flyby
		type = CompleteContract
		contractType = Race_Neptune_Flyby
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Flyby Triton

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = FlybyBody
			type = ReachState
			maxAltitude = 20000000
			disableOnStateChange = true
			title = Flyby Triton within 20,000 km
			hideChildren = true
		}
	}
}

