	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Iapetus sample return

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
