	targetBody = Europa

	// No rewards, this is purely a race tracker
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 0
	failureReputation = 0

