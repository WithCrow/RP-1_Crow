CONTRACT_TYPE
{
	name = Race_Uranus_Flyby
	title = Race: Uranus Flyby
	group = RaceFirsts
	agent = Federation Aeronautique Internationale

	description = <b>Race: Exploration Firsts</b><br><br>Send an uncrewed vessel on a flyby of Uranus, passing within 670,000 km.

	synopsis = Flyby Uranus within 670,000 km (uncrewed)

	completedMessage = Uranus flyby complete!

	sortKey = 200

	cancellable = false
	declinable = false
	autoAccept = true
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Uranus

	// No rewards, this is purely a race tracker
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 0
	failureReputation = 0

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Flyby Uranus

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = FlybyBody
			type = ReachState
			maxAltitude = 670000000
			disableOnStateChange = true
			title = Flyby Uranus within 670,000 km
			hideChildren = true
		}
	}
}

CONTRACT_TYPE
