	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Neptune sample return

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = Landing
			type = ReachState
			situation = FLYING
			maxAltitude = 800000
			disableOnStateChange = true
			title = Enter Neptune's atmosphere below 800 km
			hideChildren = true
		}
