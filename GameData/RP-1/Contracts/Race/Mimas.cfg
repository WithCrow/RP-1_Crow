	targetBody = Mimas

	// No rewards, this is purely a race tracker
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 0
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = CompleteContract_Race_Mimas_Landing
		type = CompleteContract
		contractType = Race_Mimas_Landing
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Mimas sample return

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = Landing
			type = ReachState
			situation = LANDED
			situation = SPLASHED
			disableOnStateChange = true
			title = Safely land on Mimas
			hideChildren = true
		}
		PARAMETER
		{
			name = ReturnHome
