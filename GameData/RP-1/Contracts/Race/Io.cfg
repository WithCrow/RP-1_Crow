CONTRACT_TYPE
{
	name = Race_Io_Flyby
	title = Race: Io Flyby
	group = RaceFirsts
	agent = Federation Aeronautique Internationale

	description = <b>Race: Exploration Firsts</b><br><br>Send an uncrewed vessel on a flyby of Io, passing within 20,000 km. This contract unlocks after the uncrewed flyby of Jupiter.

	synopsis = Flyby Io within 20,000 km (uncrewed)

	completedMessage = Io flyby complete!

	sortKey = 80

	cancellable = false
	declinable = false
	autoAccept = true
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = Io

	// No rewards, this is purely a race tracker
	prestige = Trivial
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 0
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = CompleteContract_Race_Jupiter_Flyby
		type = CompleteContract
		contractType = Race_Jupiter_Flyby
	}

	// ************ PARAMETERS ************

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Flyby Io

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = FlybyBody
			type = ReachState
			maxAltitude = 20000000
			disableOnStateChange = true
			title = Flyby Io within 20,000 km
			hideChildren = true
		}
	}
}

